modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="thaumcraft"
mandatory=true
versionRange="[${thaumcraft_runtime_version}]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
mandatory=true
versionRange="[5.14.1+1.20.1,6)"
ordering="AFTER"
side="BOTH"

# Middle-earth is a Fabric mod loaded through Sinytra Connector, so it cannot be a hard dependency:
# every Middle-earth hook degrades to "not available" when the mod is missing.
[[dependencies.${mod_id}]]
modId="me"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="BOTH"
